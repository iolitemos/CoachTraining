<app-page-header
  [title]="isEditMode() ? 'แก้ไขข้อมูลนักกีฬา' : 'เพิ่มนักกีฬา'"
  subtitle="ข้อมูลหลักนักกีฬาที่ใช้ในการเช็คชื่อฝึกซ้อม"
>
  <a actions routerLink="/athletes" class="text-sm font-medium text-text-secondary hover:underline">ย้อนกลับ</a>
</app-page-header>

<div class="mt-4 max-w-xl">
  @if (loading()) {
    <app-loading-indicator label="กำลังโหลดข้อมูล..." />
  } @else {
    <form class="flex flex-col gap-4 rounded-xl border border-border bg-surface p-5" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div>
        <label for="athleteCode" class="mb-1 block text-sm font-medium text-text">
          รหัสนักกีฬา <span class="text-danger">*</span>
        </label>
        <input
          id="athleteCode"
          type="text"
          formControlName="athleteCode"
          class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text disabled:bg-secondary-50 disabled:text-text-secondary focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
        />
        @if (form.controls.athleteCode.invalid && form.controls.athleteCode.touched) {
          <p class="mt-1 text-xs text-danger">กรุณากรอกรหัสนักกีฬา</p>
        }
      </div>

      <div>
        <label for="fullName" class="mb-1 block text-sm font-medium text-text">
          ชื่อ-นามสกุล <span class="text-danger">*</span>
        </label>
        <input
          id="fullName"
          type="text"
          formControlName="fullName"
          class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
        />
        @if (form.controls.fullName.invalid && form.controls.fullName.touched) {
          <p class="mt-1 text-xs text-danger">กรุณากรอกชื่อ-นามสกุล</p>
        }
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="nickname" class="mb-1 block text-sm font-medium text-text">ชื่อเล่น</label>
          <input
            id="nickname"
            type="text"
            formControlName="nickname"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="dateOfBirth" class="mb-1 block text-sm font-medium text-text">วันเกิด</label>
          <app-date-input class="block w-full" inputId="dateOfBirth" formControlName="dateOfBirth" ariaLabel="วันเกิด" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="phoneNumber" class="mb-1 block text-sm font-medium text-text">เบอร์โทรศัพท์</label>
          <input
            id="phoneNumber"
            type="text"
            formControlName="phoneNumber"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="athleteLevel" class="mb-1 block text-sm font-medium text-text">ระดับนักกีฬา</label>
          <input
            id="athleteLevel"
            type="text"
            formControlName="athleteLevel"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="parentName" class="mb-1 block text-sm font-medium text-text">ชื่อผู้ปกครอง</label>
          <input
            id="parentName"
            type="text"
            formControlName="parentName"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="parentPhoneNumber" class="mb-1 block text-sm font-medium text-text">เบอร์โทรผู้ปกครอง</label>
          <input
            id="parentPhoneNumber"
            type="text"
            formControlName="parentPhoneNumber"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
          />
        </div>
      </div>

      <div>
        <label for="joinDate" class="mb-1 block text-sm font-medium text-text">วันที่เข้าร่วม</label>
        <app-date-input class="block w-full max-w-xs" inputId="joinDate" formControlName="joinDate" ariaLabel="วันที่เข้าร่วม" />
      </div>

      <div>
        <label for="remarks" class="mb-1 block text-sm font-medium text-text">หมายเหตุ</label>
        <textarea
          id="remarks"
          rows="3"
          formControlName="remarks"
          class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none"
        ></textarea>
      </div>

      @if (errorMessage()) {
        <p class="rounded-lg bg-danger-surface px-3 py-2 text-sm text-danger">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="mt-2 rounded-lg bg-primary-600 py-2.5 text-sm font-medium text-white transition-colors hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ submitting() ? 'กำลังบันทึก...' : 'บันทึก' }}
      </button>
    </form>
  }
</div>
