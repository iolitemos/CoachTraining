<app-page-header title="เปลี่ยนรหัสผ่าน" subtitle="ดูแลความปลอดภัยของบัญชีด้วยรหัสผ่านที่คาดเดาได้ยาก">
  <a actions routerLink="/" class="text-sm font-medium text-text-secondary hover:underline">กลับหน้าหลัก</a>
</app-page-header>

<section class="mt-4 max-w-xl">
  <div class="rounded-2xl border border-blue-100 bg-surface p-5 shadow-sm sm:p-8">
    <p class="rounded-xl border border-blue-100 bg-blue-50 p-3 text-sm text-blue-800">รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร</p>
    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="block text-sm font-medium text-text">รหัสผ่านปัจจุบัน
        <input type="password" autocomplete="current-password" formControlName="currentPassword" class="mt-1 w-full rounded-xl border border-border px-4 py-3 outline-none focus:border-primary-500" />
      </label>
      <label class="block text-sm font-medium text-text">รหัสผ่านใหม่
        <input type="password" autocomplete="new-password" formControlName="newPassword" class="mt-1 w-full rounded-xl border border-border px-4 py-3 outline-none focus:border-primary-500" />
        @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) { <span class="mt-1 block text-xs text-danger">กรุณากรอกอย่างน้อย 8 ตัวอักษร</span> }
      </label>
      <label class="block text-sm font-medium text-text">ยืนยันรหัสผ่านใหม่
        <input type="password" autocomplete="new-password" formControlName="confirmPassword" class="mt-1 w-full rounded-xl border border-border px-4 py-3 outline-none focus:border-primary-500" />
      </label>
      @if (message()) { <p class="rounded-xl bg-emerald-50 p-3 text-sm text-emerald-700" role="status">{{ message() }}</p> }
      @if (error()) { <p class="rounded-xl bg-red-50 p-3 text-sm text-danger" role="alert">{{ error() }}</p> }
      <div class="flex gap-3"><button type="submit" [disabled]="submitting()" class="rounded-xl bg-primary-600 px-5 py-3 font-medium text-white disabled:opacity-60">{{ submitting() ? 'กำลังบันทึก...' : 'เปลี่ยนรหัสผ่าน' }}</button><a routerLink="/" class="rounded-xl border border-border px-5 py-3">ยกเลิก</a></div>
    </form>
  </div>
</section>
