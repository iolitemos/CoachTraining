<main class="flex min-h-screen items-center justify-center bg-background p-4">
  <section class="w-full max-w-md rounded-2xl border border-border bg-surface p-6 shadow-lg sm:p-8">
    <h1 class="text-center text-2xl font-semibold text-text">ตั้งรหัสผ่านใหม่</h1>
    @if (completed()) { <p class="mt-6 rounded-xl bg-emerald-50 p-4 text-sm text-emerald-700">ตั้งรหัสผ่านใหม่สำเร็จแล้ว</p><a routerLink="/login" class="mt-5 block text-center font-medium text-primary-600">เข้าสู่ระบบ</a> }
    @else {
      <p class="mt-2 text-center text-sm text-text-secondary">รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร</p>
      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block text-sm font-medium text-text">รหัสผ่านใหม่<input type="password" autocomplete="new-password" formControlName="newPassword" class="mt-1 w-full rounded-xl border border-border px-4 py-3 outline-none focus:border-primary-500" /></label>
        <label class="block text-sm font-medium text-text">ยืนยันรหัสผ่านใหม่<input type="password" autocomplete="new-password" formControlName="confirmPassword" class="mt-1 w-full rounded-xl border border-border px-4 py-3 outline-none focus:border-primary-500" /></label>
        @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) { <p class="text-xs text-danger">กรุณากรอกอย่างน้อย 8 ตัวอักษร</p> }
        @if (error()) { <p class="rounded-xl bg-red-50 p-3 text-sm text-danger" role="alert">{{ error() }}</p> }
        <button type="submit" [disabled]="submitting() || !token" class="w-full rounded-xl bg-primary-600 px-5 py-3 font-medium text-white disabled:opacity-60">{{ submitting() ? 'กำลังบันทึก...' : 'ตั้งรหัสผ่านใหม่' }}</button>
      </form>
      <a routerLink="/forgot-password" class="mt-5 block text-center text-sm font-medium text-primary-600">ขอลิงก์ใหม่</a>
    }
  </section>
</main>
