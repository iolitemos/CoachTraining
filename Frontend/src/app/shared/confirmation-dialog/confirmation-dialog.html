@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-sm rounded-xl bg-surface p-5 shadow-lg">
      <h2 class="text-base font-semibold text-text">{{ title() }}</h2>
      <p class="mt-2 text-sm text-text-secondary">{{ message() }}</p>

      <div class="mt-5 flex justify-end gap-2">
        <button
          type="button"
          class="rounded-lg border border-border px-4 py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-secondary-50 disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="processing()"
          (click)="cancelled.emit()"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          class="rounded-lg px-4 py-2 text-sm font-medium text-white transition-colors disabled:cursor-not-allowed disabled:opacity-50"
          [class]="danger() ? 'bg-danger hover:bg-danger-hover' : 'bg-primary-600 hover:bg-primary-700'"
          [disabled]="processing()"
          (click)="confirmed.emit()"
        >
          {{ processing() ? 'กำลังดำเนินการ...' : confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
