@if (open()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-0 sm:items-center sm:p-4">
    <div class="max-h-[92vh] w-full max-w-sm overflow-y-auto rounded-t-2xl bg-surface p-4 shadow-lg sm:rounded-xl sm:p-5">
      <h2 class="text-base font-semibold text-text">{{ title() }}</h2>
      <p class="mt-2 text-sm text-text-secondary">{{ message() }}</p>

      <div class="mt-5 grid grid-cols-2 gap-2 sm:flex sm:justify-end">
        <button
          type="button"
          class="min-h-11 rounded-lg border border-border px-3 py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-secondary-50 disabled:cursor-not-allowed disabled:opacity-50 sm:px-4"
          [disabled]="processing()"
          (click)="cancelled.emit()"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          class="min-h-11 rounded-lg px-3 py-2 text-sm font-medium text-white transition-colors disabled:cursor-not-allowed disabled:opacity-50 sm:px-4"
          [class]="danger() ? 'bg-danger hover:bg-danger-hover' : 'bg-primary-600 hover:bg-primary-700'"
          [disabled]="processing()"
          (click)="confirmed.emit()"
        >
          {{ processing() ? 'กำลังดำเนินการ...' : confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
