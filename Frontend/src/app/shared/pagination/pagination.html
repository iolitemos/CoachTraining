<div class="flex flex-col-reverse items-center justify-between gap-3 border-t border-border pt-3 sm:flex-row">
  <p class="text-sm text-text-secondary">
    แสดง {{ rangeStart() }}–{{ rangeEnd() }} จากทั้งหมด {{ totalCount() }} รายการ
  </p>

  <div class="flex items-center gap-2">
    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-border bg-surface text-text-secondary transition-colors hover:bg-secondary-50 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="page() <= 1"
      (click)="goToPrevious()"
      aria-label="หน้าก่อนหน้า"
    >
      <svg lucideChevronLeft [size]="18"></svg>
    </button>

    <span class="text-sm font-medium text-text">หน้า {{ page() }} / {{ totalPages() }}</span>

    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-border bg-surface text-text-secondary transition-colors hover:bg-secondary-50 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="page() >= totalPages()"
      (click)="goToNext()"
      aria-label="หน้าถัดไป"
    >
      <svg lucideChevronRight [size]="18"></svg>
    </button>
  </div>
</div>
