<header class="page-header-hero">
  <div class="page-header-copy">
    <p class="page-header-kicker"><span aria-hidden="true"></span>ระบบบริหารการฝึกซ้อม</p>
    <h1>{{ title() }}</h1>
    @if (subtitle()) {
      <p class="page-header-subtitle">{{ subtitle() }}</p>
    }
  </div>

  <div class="page-header-court" aria-hidden="true">
    <span class="page-header-court-line"></span>
    <span class="page-header-court-net"></span>
    <span class="page-header-court-ball"></span>
  </div>

  <div class="page-header-actions">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
