<div class="flex flex-col items-center justify-center gap-3 rounded-xl border border-danger-surface bg-danger-surface py-12 px-4 text-center">
  <svg lucideTriangleAlert class="h-10 w-10 text-danger" [size]="40"></svg>
  <p class="text-sm font-medium text-danger">{{ message() }}</p>
  @if (retryable()) {
    <button
      type="button"
      class="mt-1 inline-flex items-center gap-1.5 rounded-lg bg-danger px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-danger-hover"
      (click)="retry.emit()"
    >
      <svg lucideRefreshCw [size]="16"></svg>
      ลองใหม่อีกครั้ง
    </button>
  }
</div>
