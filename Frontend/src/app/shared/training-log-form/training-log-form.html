<div class="rounded-xl border border-border bg-surface p-4">
  <h3 class="text-sm font-semibold text-text">บันทึกการฝึกซ้อม</h3>

  @if (errorMessage()) {
    <p class="mt-2 text-sm text-danger">{{ errorMessage() }}</p>
  }
  @if (savedFlag()) {
    <p class="mt-2 text-sm text-success">บันทึกข้อมูลสำเร็จ</p>
  }

  <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
    <label class="flex flex-col gap-1 text-sm">
      <span class="text-text-secondary">หัวข้อการฝึกซ้อม</span>
      <input
        type="text"
        [(ngModel)]="form.topic"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="text-text-secondary">วัตถุประสงค์</span>
      <input
        type="text"
        [(ngModel)]="form.objective"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="text-text-secondary">แบบฝึก / ท่าฝึก</span>
      <input
        type="text"
        [(ngModel)]="form.exerciseDrill"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="text-text-secondary">จุดเน้นการฝึก</span>
      <input
        type="text"
        [(ngModel)]="form.focus"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="text-text-secondary">ความหนักของการฝึก</span>
      <input
        type="text"
        [(ngModel)]="form.intensity"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm sm:col-span-2">
      <span class="text-text-secondary">บันทึกของโค้ช</span>
      <textarea
        rows="2"
        [(ngModel)]="form.coachNotes"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      ></textarea>
    </label>
    <label class="flex flex-col gap-1 text-sm sm:col-span-2">
      <span class="text-text-secondary">บันทึกเกี่ยวกับนักกีฬา</span>
      <textarea
        rows="2"
        [(ngModel)]="form.athleteNotes"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      ></textarea>
    </label>
    <label class="flex flex-col gap-1 text-sm sm:col-span-2">
      <span class="text-text-secondary">หมายเหตุทั่วไป</span>
      <textarea
        rows="2"
        [(ngModel)]="form.generalRemarks"
        [disabled]="readOnly()"
        class="rounded-lg border border-border bg-surface px-3 py-2 text-text disabled:opacity-60"
      ></textarea>
    </label>
  </div>

  @if (!readOnly()) {
    <button
      type="button"
      (click)="save()"
      [disabled]="saving()"
      class="mt-3 rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-700 disabled:opacity-60"
    >
      {{ saving() ? 'กำลังบันทึก...' : 'บันทึกข้อมูล' }}
    </button>
  }
</div>
