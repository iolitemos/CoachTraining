@if (open()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-0 sm:items-center sm:p-4">
    <div class="max-h-[92vh] w-full max-w-md overflow-y-auto rounded-t-2xl bg-surface p-4 shadow-lg sm:rounded-xl sm:p-5">
      <h2 class="text-base font-semibold text-text">ยืนยันการยกเลิกเซสชัน</h2>
      <p class="mt-1 text-xs text-text-secondary">
        เซสชันที่ยกเลิกจะยังคงอยู่ในประวัติ แต่จะไม่นับเป็นชั่วโมงสอนที่เสร็จสิ้น
      </p>

      @if (errorMessage()) {
        <p class="mt-3 text-sm text-danger">{{ errorMessage() }}</p>
      }

      <label class="mt-4 flex flex-col gap-1 text-sm">
        <span class="text-text-secondary">เหตุผลในการยกเลิก <span class="text-danger">*</span></span>
        <textarea
          rows="3"
          [(ngModel)]="reason"
          class="rounded-lg border border-border bg-surface px-3 py-2 text-text"
        ></textarea>
      </label>

      <div class="mt-5 grid grid-cols-2 gap-2 sm:flex sm:justify-end">
        <button
          type="button"
          (click)="dismiss()"
          [disabled]="submitting()"
          class="min-h-11 rounded-lg border border-border px-3 py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-secondary-100 disabled:opacity-60 sm:px-4"
        >
          ปิด
        </button>
        <button
          type="button"
          (click)="confirmCancel()"
          [disabled]="submitting()"
          class="min-h-11 rounded-lg bg-danger px-3 py-2 text-sm font-medium text-white transition-colors hover:opacity-90 disabled:opacity-60 sm:px-4"
        >
          {{ submitting() ? 'กำลังยกเลิก...' : 'ยืนยันยกเลิกเซสชัน' }}
        </button>
      </div>
    </div>
  </div>
}
